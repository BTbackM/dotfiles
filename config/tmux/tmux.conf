unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -s set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g allow-rename off

unbind '"'
unbind %

bind | split-window -h
bind - split-window -v
bind C-p run-shell "spotify_tmux"
bind C-j display-popup -E "session_fzf"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-n select-window -t :+
bind -n M-p select-window -t :-

bind r source-file ~/.tmux.conf

set -g pane-border-style 'fg=#665C54'
set -g pane-active-border-style 'fg=#7287FD'

set -g status-position bottom
set -g status-style 'fg=#FBF1C7 bold'

# Vertical padding (blank line on top)
set -g status 2
set -g status-format[0] ""
set -g status-format[1] "#[fg=#F9F5D7 bg=default]   #S  #[align=centre]#{W:#[fg=#CC241D bg=default] #I #[fg=#F9F5D7]#W #[fg=#B57614]#F ,#[fg=#B57614 bg=#00204F bold] #I #[fg=#F9F5D7]#W #F #[default]}#[align=right]#[fg=#F9F5D7 bold] %H:%M %d-%b "
